name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package.json ]; then npm install; else echo "No package.json yet - nothing to install"; fi
      - name: Test
        run: |
          if [ -f package.json ]; then npm test; else echo "No package.json yet - nothing to test"; fi
